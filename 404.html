<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미래엔수학 자이학원 | 홈페이지 임시 점검 안내</title>
<meta name="description" content="미래엔수학 자이학원 홈페이지는 현재 임시 점검 중입니다. 문의는 전화 또는 카카오톡 채널로 부탁드립니다.">
<meta property="og:title" content="미래엔수학 자이학원 | 홈페이지 임시 점검 안내">
<meta property="og:description" content="홈페이지는 현재 임시 점검 중입니다. 문의는 전화 또는 카카오톡 채널로 부탁드립니다.">
<meta property="og:type" content="website">
<style>
  :root {
    --navy: #243B53;
    --navy-light: #3A5A7A;
    --mint: #47BCC0;
    --mint-light: #E8F7F7;
    --mint-deep: #2F9A9E;
    --yellow: #F4D35E;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --text: #374151;
    --text-secondary: #6B7280;
    --border: #DEE5EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, var(--bg) 0%, var(--mint-light) 100%);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(36, 59, 83, 0.12);
    padding: 48px 36px 40px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--mint-light);
    color: var(--mint-deep);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .brand {
    margin-top: 22px;
    font-size: 15px;
    font-weight: 700;
    color: var(--mint-deep);
    letter-spacing: 0.04em;
  }
  h1 {
    margin-top: 8px;
    font-size: 27px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.02em;
    line-height: 1.4;
  }
  .divider {
    width: 48px;
    height: 4px;
    margin: 24px auto;
    border-radius: 999px;
    background: var(--yellow);
  }
  p.lead {
    font-size: 16px;
    color: var(--text);
  }
  p.sub {
    margin-top: 14px;
    font-size: 15px;
    color: var(--text-secondary);
  }
  .contact {
    margin-top: 32px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }
  .contact-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
  }
  .btns {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: block;
    padding: 15px 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(36, 59, 83, 0.14); }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-kakao { background: #FEE500; color: #191600; }
  .address {
    margin-top: 22px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  @media (max-width: 480px) {
    .card { padding: 40px 24px 32px; border-radius: 16px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">임시 점검 중</span>
    <div class="brand">미래엔수학 자이학원</div>
    <h1>홈페이지를<br>잠시 닫아두었습니다</h1>
    <div class="divider"></div>
    <p class="lead">홈페이지 정비를 위해 현재 페이지 이용을 잠시 중단하고 있습니다.</p>
    <p class="sub">정비가 끝나는 대로 다시 열어드리겠습니다.<br>이용에 불편을 드려 죄송합니다.</p>

    <div class="contact">
      <div class="contact-title">문의</div>
      <div class="btns">
        <a class="btn btn-primary" href="tel:051-927-1638">전화 문의 051-927-1638</a>
        <a class="btn btn-kakao" href="https://pf.kakao.com/_arMaG/chat" target="_blank" rel="noopener">카카오톡 채널 문의</a>
      </div>
      <div class="address">부산 수영구 호암로29번길 45, 401호</div>
    </div>
  </main>
</body>
</html>
